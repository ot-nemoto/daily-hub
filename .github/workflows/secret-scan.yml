name: secret-scan

# 秘密情報の混入検出（gitleaks）。ci.yml とは意図的に分離している。
#  - トリガーが違う: PR は差分のみ、schedule は全履歴（すでに履歴に入った値を拾うため）
#  - 失敗の意味が違う: lint・型・テストのマージゲートを誤検知で止めたくない
#
# GitHub の secret scanning / push protection は有効だが、検出対象はプロバイダ固有
# パターンに限られる。T221 (#435) の固定値はいずれも素通りしたため本ワークフローで補う。
#
# 本ファイルは現在このリポジトリ所有（dev-commons の sync-config.json に未登録のため
# check-drift の比較対象外）。誤検知の実地確認後に dev-commons の base へ昇格する予定（#441）。

on:
  pull_request:
    branches:
      - develop
      - master
  schedule:
    - cron: "0 21 * * 0" # 月曜 6:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # 全履歴スキャンには全コミットが必要（既定の shallow clone では走査できない）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 公式の gitleaks-action は Organization で有料ライセンスキーを要求するため CLI を直接使う。
      # バージョンは固定する: latest だと検出ルールの変化で CI の挙動が黙って変わる
      # （biome.json の $schema をインストール済み実体に向けているのと同じ理由）。
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # ルール・allowlist はリポジトリ直下の .gitleaks.toml が自動で読まれる。
      # --redact: public リポジトリの CI ログに検出値そのものを出さない。
      # PR は base..head の範囲（途中のコミットで追加され後で消された値も拾える）。
      # schedule / 手動は全履歴（584 コミットで 10 秒程度）。
      # github コンテキストは env 経由で渡す（run への直接展開はコマンド注入になりうる）。
      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks git . --no-banner --redact --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
          else
            gitleaks git . --no-banner --redact
          fi
