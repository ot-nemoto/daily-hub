# gitleaks（秘密情報スキャナ）の設定。
#
# このファイルは **このリポジトリ所有**。カスタムルールの prefix や allowlist の対象は
# リポジトリ固有のため、dev-commons からは配布しない（`.claude/project.md` と同じ扱い）。
# 実行するワークフローは `.github/workflows/secret-scan.yml`。
#
# ローカル実行: gitleaks git .            （全履歴）
#               gitleaks dir .            （作業ツリー）

[extend]
useDefault = true

[allowlist]
description = "ビルド生成物と、T221 (#435) で排除済みの既知の公開値"

# ビルド生成物。ローカルで `gitleaks dir` を使うとハッシュ値を大量に拾うため除外する
# （git スキャンでは gitignore 済みのため元々現れない）。
#
# 一方 `.env` / `e2e/.auth/*.json` / `.claude/settings.json` は意図的に除外しない。
# これらも gitignore 済みで git スキャンには現れないが、除外すると万一コミットされた
# 場合に検出できなくなる。`gitleaks dir` ではこれらが常に検出される（既知・読み飛ばす）。
paths = [
  '''^\.next/''',
  '''^node_modules/''',
  '''^coverage/''',
  '''^playwright-report/''',
  '''^test-results/''',
]

# 履歴に残る既知の値の抑止には 2 つの手段があり、**出現箇所の数で選び分ける**（T230）。
#
# | 手段 | 粒度 | 向く場面 |
# |------|------|---------|
# | `allowlist.regexes`（ここ） | 値単位・全コミット/ファイル/ルールに及ぶ | 同じ値が履歴の多数箇所に出る |
# | `.gitleaksignore` の Fingerprint（`<commit>:<file>:<rule>:<line>`） | 1 箇所単位 | 出現が数箇所に限られる |
#
# Fingerprint は抑止範囲が狭く、値を平文で持たずに済む点で優れる。ただし **1 箇所でも
# 書き漏らすと週次の全履歴スキャンが落ちる**。下の 3 値は履歴の 14 箇所に散っており、
# Fingerprint だと 14 行の列挙と維持が必要になるため regexes を採る。
# （eval-hub は出現が少ないため Fingerprint を採用しており、手段が異なるのは意図的）
#
# T221 (#435) までシードにハードコードされていた固定 APIキー 3 件。
# 公開リポジトリの履歴からは消せないため allowlist する。除外しないと週次の全履歴
# スキャンが恒久的に失敗し、検査そのものが無視されるようになる。
# いずれも本番 DB・本番 Clerk では未使用で、現在のシードは実行ごとに値を生成する。
# 値が現行ツリーに平文で残るが、いずれも無効化済みのため許容する。
regexes = [
  '''a1b2c3d4-e5f6-7890-abcd-ef1234567890''',
  '''b1e3a704-e5f6-7890-abcd-ef1234567890''',
  '''c1d2e3f4-a5b6-7890-abcd-ef1234567890''',
]

# 外部連携 APIキー（#436 で導入した dh_ prefix 付きの書式: dh_ + base64url(32 bytes) = 43 文字）。
# 既定ルールは自前の接頭辞を知らないため、接頭辞を実際の検出へ結びつけるのはこのルール。
# GitHub の secret scanning でこれを行うには custom patterns（有料）が必要（#436 参照）。
#
# 正規表現の形は 3 リポジトリ（daily-hub / link-hub / eval-hub）で揃えている（T230）。
# gitleaks 8.30.1 で 8 ケースを実測し、偽陽性・偽陰性がいずれも出ない形を採用した。
#
# - **長さは 43 文字ちょうど**に固定する。雛形の `{20,}` だと `dh_` 始まりの定数名や
#   Cookie 名を拾う（実測: 20 文字・45 文字の識別子がいずれも誤検知）。
#   現在のコードに無くても履歴に残れば週次の全履歴スキャンが恒久的に落ちる
# - **末尾にだけ境界を置く**。44 文字以上の `dh_` 識別子を除外するため
# - **先頭には境界を置かない**。`KEY_dh_…` のように直前が `[A-Za-z0-9_-]` でも本物のキーは
#   検出したい（実測: 先頭に境界を置くと `KEY_dh_<キー>` を見逃す）。
#   gitleaks の正規表現は RE2 で後読みが使えないため、境界は文字クラスで表現するしかない
# - `secretGroup` でキー部分だけを取り出す。末尾境界が 1 文字を食うため、
#   これが無いと報告される Secret に引用符などが混ざる
# - `entropy` は低エントロピーな 43 文字識別子（`dh_aaaa_bbbb_…`）を除く下限。
#   実キーは base64url(32 bytes) で 4.3 以上になる（実測値の一例: 4.768）
#
# キーの書式を変えるときは、このルールも必ず追随させること。
[[rules]]
id = "daily-hub-api-key"
description = "daily-hub の外部連携 APIキー（dh_ prefix）"
regex = '''(dh_[A-Za-z0-9_-]{43})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["dh_"]
